<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Grid</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>

<header>
  <h1>Poldoku</h1>
  <p class="subtitle">Finde neun Politiker, die jeweils den Kategorien in den Spalten und Zeilen entsprechen</p>
</header>

<div class="progress-row">
  <div class="track"><div class="fill" id="fill"></div></div>
  <span class="prog-label" id="prog-label">0 / 9</span>
  <span class="wrong-answers-label" id="wrong-answers-label">0</span>
  <span class="difficulty-rating" id="difficulty-rating">Schwierigkeit<span class="stars">★★★★★</span></span>
</div>

<div class="grid" id="grid"></div>
<div class="label-tooltip" id="label-tooltip"></div>

<!-- Option picker modal -->
<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="modal-head">
      <div>
        <p class="modal-eyebrow">Antwort für Kategorien</p>
        <div class="modal-tags">
          <span class="tag r" id="tag-row"></span>
          <span class="plus">+</span>
          <span class="tag c" id="tag-col"></span>
        </div>
      </div>
      <button class="x-btn" id="x-btn">✕</button>
    </div>
    <div class="opts-text-box" contenteditable="true" placeholder="Antwort eingeben..."></div>
    <div class="opts" id="opts"></div>
  </div>
</div>

<!-- Win screen -->
<div class="win" id="win">
  <div class="win-box">
    <div class="win-icon">🇩🇪</div>
    <div class="win-title">Puzzle gelöst!</div>
    <p class="win-sub">Du hast jedes Feld korrekt ausgefüllt.</p>
    <button class="again-btn" id="again-btn">Nochmal spielen</button>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="imprint.html">Impressum</a>
    <a href="dataset.html">Vollständiger Datensatz</a>
  </div>
</footer>

<script src="main.js" type="module"></script>
</body>
</html>
