<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Grid</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    [contenteditable=true]:empty:before{
      content: attr(placeholder);
      color: #52565f;
      font-size: 0.72rem;
      font-weight: 500;
      pointer-events: none;
      display: block; /* For Firefox */
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14161c;
      background-image:
        radial-gradient(ellipse at 15% 25%, rgba(60, 75, 95, 0.16) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 75%, rgba(50, 65, 80, 0.14) 0%, transparent 55%);
      font-family: 'Inter', sans-serif;
      color: #b8bcc6;
      gap: 1.4rem;
    }

    header { text-align: center; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #dfe1e8;
      letter-spacing: 0.04em;
      text-shadow: 0 0 24px rgba(100, 116, 139, 0.28);
    }

    .subtitle {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #52565f;
      margin-top: 0.5rem;
    }

    /* ── Progress ── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 486px;
      max-width: 94vw;
    }

    .track {
      flex: 1;
      height: 3px;
      background: #20222a;
      border-radius: 3px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #465063, #62728a);
      border-radius: 3px;
      transition: width 0.45s ease;
    }

    .prog-label {
      font-size: 0.7rem;
      color: #52565f;
      min-width: 30px;
      text-align: right;
    }

    .wrong-answers-label {
      font-size: 0.7rem;
      color: #bd2b41;
      min-width: 30px;
      text-align: right;
    }

    .wrong-answers-label::before {
      content: "❌";
      margin-right: 4px;
      font-size: 0.5rem;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 96px repeat(3, 126px);
      grid-template-rows: 68px repeat(3, 108px);
      gap: 6px;
    }

    .corner { /* empty */ }

    .col-label,
    .row-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #191b22;
      border: 1px solid #282a34;
      border-radius: 10px;
      padding: 8px 6px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      overflow-wrap: break-word;
      cursor: help;
    }

    .lbl-icon {
      max-height: 20px;
    }

    /* ── Cells ── */
    .cell {
      background: #16171f;
      border: 1.5px dashed #262832;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s, box-shadow 0.14s;
      text-align: center;
      padding: 10px;
      font-size: 0.82rem;
      position: relative;
    }

    .cell:not(.filled):hover {
      background: #1c1e28;
      border-color: #444c5c;
      border-style: solid;
      box-shadow: 0 0 16px rgba(60, 75, 95, 0.1);
    }

    .cell-hint {
      font-size: 0.68rem;
      color: #34363f;
      letter-spacing: 0.04em;
      pointer-events: none;
    }

    .cell.filled {
      background: #14201c;
      border: 1.5px solid #3a5c50;
      cursor: default;
    }

    .cell.filled:hover { box-shadow: none; }

    .cell.wrong {
      background: #2d191b;
      border-color: #8c4a4a;
      box-shadow: inset 0 0 0 1px rgba(140,74,74,0.4);
    }

    .cell.wrong .cell-hint,
    .cell.wrong .cell-answer span {
      color: #d4867c;
    }

    .label-tooltip {
      position: fixed;
      z-index: 150;
      max-width: 260px;
      padding: 12px 14px;
      background: rgba(24, 26, 36, 0.94);
      border: 1px solid rgba(100, 116, 139, 0.18);
      border-radius: 12px;
      color: #777777;
      font-size: 0.66rem;
      line-height: 1.25;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease, transform 0.16s ease;
      box-shadow: 0 18px 40px rgba(0,0,0,0.28);
      white-space: normal;
    }

    .label-tooltip.visible {
      opacity: 1;
    }

    .cell-answer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .check-ring {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #204438;
      border: 1px solid #4a8c72;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: #7cc4a8;
    }

    .check-ring.wrong {
      background: #4a1c1c;
      border-color: #8c4a4a;
      color: #d4867c;
    }

    .cell-answer span {
      color: #6cb494;
      font-weight: 600;
      font-size: 0.85rem;
    }

    /* ── Modal ── */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(6, 6, 10, 0.82);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s;
    }

    .backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #191b24;
      border: 1px solid #2c2e3a;
      border-radius: 16px;
      padding: 22px 24px 26px;
      width: 310px;
      max-width: 92vw;
      box-shadow: 0 28px 72px rgba(0,0,0,0.7), 0 0 44px rgba(50,58,72,0.1);
      transform: scale(0.95) translateY(6px);
      transition: transform 0.18s;
    }

    .backdrop.open .modal {
      transform: scale(1) translateY(0);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .modal-eyebrow {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #484a58;
      margin-bottom: 6px;
    }

    .modal-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

    .tag {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .tag.r { background: rgba(50,70,90,0.24); color: #5c8494; border: 1px solid rgba(50,70,90,0.4); }
    .tag.c { background: rgba(60,66,80,0.24); color: #8890a2; border: 1px solid rgba(60,66,80,0.4); }
    .plus { color: #383a46; font-size: 0.75rem; }

    .x-btn {
      background: none;
      border: none;
      color: #40424e;
      font-size: 1rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.14s;
    }
    .x-btn:hover { color: #868c9c; }

    .opts { 
      display: flex; 
      flex-direction: column; 
      gap: 7px;
      max-height: 200px;
      overflow-y: auto;
    }

    .opts-text-box {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 14px;
      margin-bottom: 16px;
      border-radius: 9px;
      background: rgba(60,66,80,0.24);
      color: #8890a2;
      border: 1px solid rgba(60,66,80,0.4);
      outline: none;
      transition: background 0.13s, border-color 0.13s, color 0.13s, box-shadow 0.13s;
      min-height: 20px;
    }

    .opts-text-box:focus {
      background: rgba(80,90,110,0.32);
      border-color: rgba(80,90,110,0.6);
      color: #dadde4;
      box-shadow: 0 0 12px rgba(60,75,95,0.2);
    }

    .opts-text-box.wrong {
      background: #201616;
      border-color: #8c5c4a;
      color: #c49080;
      animation: jolt 0.32s ease;
    }

    .opt {
      background: #20222c;
      border: 1px solid #2e303c;
      color: #a4a8b6;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 9px;
      padding: 10px 14px;
      transition: background 0.13s, border-color 0.13s, color 0.13s;
    }

    .opt:hover { background: #262836; border-color: #444c5c; color: #dcdee6; }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #3e4250;
      flex-shrink: 0;
      transition: background 0.13s;
    }
    .opt:hover .dot { background: #62728a; }

    .opt.correct {
      background: #142018;
      border-color: #4a8c72;
      color: #7cbc9c;
      animation: pop 0.32s ease;
    }
    .opt.correct .dot { background: #4a8c72; }

    .opt.wrong {
      background: #201616;
      border-color: #8c5c4a;
      color: #c49080;
      animation: jolt 0.32s ease;
    }
    .opt.wrong .dot { background: #8c5c4a; }

    @keyframes pop  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
    @keyframes jolt { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

    /* ── Win overlay ── */
    .win {
      position: fixed;
      inset: 0;
      background: rgba(6,6,10,0.88);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s;
    }

    .win.show { opacity: 1; pointer-events: all; }

    .win-box {
      background: #181a24;
      border: 1px solid #3a4252;
      border-radius: 18px;
      padding: 40px 52px;
      text-align: center;
      box-shadow: 0 0 70px rgba(50,60,80,0.18), 0 28px 72px rgba(0,0,0,0.62);
    }

    .win-icon { font-size: 2.6rem; margin-bottom: 14px; }
    .win-title { font-family:'Playfair Display',serif; font-size:1.8rem; color:#dfe1e8; margin-bottom:6px; }
    .win-sub { font-size:0.78rem; color:#484a58; margin-bottom:24px; }

    .again-btn {
      background: linear-gradient(135deg, #38404e, #4c5668);
      border: none;
      border-radius: 10px;
      padding: 11px 30px;
      color: #dadde4;
      font-family: 'Inter', sans-serif;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: opacity 0.15s;
    }
    .again-btn:hover { opacity: 0.78; }
  </style>
</head>
<body>

<header>
  <h1>Poldoku</h1>
  <p class="subtitle">Finde neun Politiker, die jeweils den Kategorien in den Spalten und Zeilen entsprechen</p>
</header>

<div class="progress-row">
  <div class="track"><div class="fill" id="fill"></div></div>
  <span class="prog-label" id="prog-label">0 / 9</span>
  <span class="wrong-answers-label" id="wrong-answers-label">0</span>
</div>

<div class="grid" id="grid"></div>
<div class="label-tooltip" id="label-tooltip"></div>

<!-- Option picker modal -->
<div class="backdrop" id="backdrop">
  <div class="modal">
    <div class="modal-head">
      <div>
        <p class="modal-eyebrow">Antwort für Kategorien</p>
        <div class="modal-tags">
          <span class="tag r" id="tag-row"></span>
          <span class="plus">+</span>
          <span class="tag c" id="tag-col"></span>
        </div>
      </div>
      <button class="x-btn" id="x-btn">✕</button>
    </div>
    <div class="opts-text-box" contenteditable="true" placeholder="Antwort eingeben..."></div>
    <div class="opts" id="opts"></div>
  </div>
</div>

<!-- Win screen -->
<div class="win" id="win">
  <div class="win-box">
    <div class="win-icon">🇩🇪</div>
    <div class="win-title">Puzzle gelöst!</div>
    <p class="win-sub">Du hast jedes Feld korrekt ausgefüllt.</p>
    <button class="again-btn" id="again-btn">Nochmal spielen</button>
  </div>
</div>

<script src="main.js" type="module"></script>
</body>
</html>
