<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impressum - Poldoku</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #14161c;
      font-family: 'Inter', sans-serif;
      color: #b8bcc6;
      gap: 1.4rem;
      padding: 2rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: #dfe1e8;
      letter-spacing: 0.04em;
    }

    p {
      color: #8890a2;
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
      max-width: 500px;
    }

    .back-button {
      margin-top: 2rem;
      background: #20222c;
      border: 1px solid #38404e;
      border-radius: 9px;
      padding: 10px 22px;
      color: #a4a8b6;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.13s, border-color 0.13s, color 0.13s;
    }

    .back-button:hover {
      background: #262836;
      border-color: #444c5c;
      color: #dcdee6;
    }

    .back-button::before {
      content: "←";
    }
  </style>
</head>
<body>
  <h1>Poldoku</h1>
  <p>Marlon Zewen, Moritz Reinhold &copy; 2026</p>
  <a href="./" class="back-button">Zurück</a>
</body>
</html>
